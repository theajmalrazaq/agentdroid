services:
  # Headless Android device (Redroid). Never expose the ADB port publicly.
  redroid:
    build:
      context: .
      dockerfile: docker/redroid/Dockerfile
      args:
        REDROID_IMAGE: ${REDROID_IMAGE:-redroid/redroid:16.0.0_64only-latest}
    image: agentdroid/redroid-silent:latest
    container_name: agentdroid-device
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDROID_ADB_PORT:-5555}:5555"
    volumes:
      - redroid-data:/data
    command:
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
      - androidboot.redroid_height=${REDROID_HEIGHT:-2400}
      - androidboot.redroid_dpi=${REDROID_DPI:-440}
      - androidboot.redroid_fps=${REDROID_FPS:-60}
      - androidboot.redroid_gpu_mode=${REDROID_GPU_MODE:-guest}
      - androidboot.use_memfd=true
      - ro.secure=0
      - ro.adb.secure=0
      - ro.debuggable=1
      - ro.setupwizard.mode=DISABLED
      - ro.audio.silent=1

  # The one central server: HTTP API + backend for the AI SDK tools.
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: agentdroid/server:latest
    container_name: agentdroid-server
    restart: unless-stopped
    depends_on:
      - redroid
    environment:
      - REDROID_ADDR=redroid:5555
      # Required: the server refuses to start on 0.0.0.0 without a key.
      - AGENTDROID_API_KEY=${AGENTDROID_API_KEY:?set AGENTDROID_API_KEY in .env}
      - AGENTDROID_CORS_ORIGIN=${AGENTDROID_CORS_ORIGIN:-}
      - AGENTDROID_TRUST_PROXY=${AGENTDROID_TRUST_PROXY:-false}
    ports:
      - "${AGENTDROID_PORT:-8080}:8080"
    volumes:
      - ./data:/data

volumes:
  redroid-data:
