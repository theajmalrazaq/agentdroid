name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check agentdroid tests scripts
      - name: Type-check with mypy
        run: mypy agentdroid
      - name: Run pytest
        run: pytest
      - name: Run unittest discovery
        run: python -m unittest discover -s tests -v

  rust:
    name: Rust (agentdroid-fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --verbose

  integrity:
    name: Shell Syntax & Packaging Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify LICENSE and NOTICE exist
        run: test -f LICENSE && test -f NOTICE
      - name: Check shell script syntax
        run: bash -n install.sh scripts/provision-device.sh bin/agentdroid
      - name: Verify bundled ArtemisAccessibilityHelper.apk SHA-256
        run: |
          python3 -c '
          from pathlib import Path
          from agentdroid.security import verify_bundled_helper_apk
          res = verify_bundled_helper_apk(Path("."), strict=True)
          print("Verified helper APK:", res["actual_sha256"])
          '
