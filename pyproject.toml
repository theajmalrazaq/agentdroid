[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdroid"
version = "0.3.0"
description = "Silent AI-Agent-Ready Android Device (Redroid) with Compound Single-Call CLI & Headless/Watch Modes"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "AgentDroid Contributors" }
]
dependencies = []

[project.scripts]
agentdroid = "agentdroid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentdroid*"]
